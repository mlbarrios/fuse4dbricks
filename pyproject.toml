[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuse4dbricks"
version = "0.7.9"
description = "FUSE driver for Databricks Unity Catalog Volumes."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sergio Oller", email = "sergioller@gmail.com"}
]
keywords = ["databricks", "fuse", "unity-catalog", "filesystem", "async", "trio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: System :: Filesystems",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "platformdirs; sys_platform != 'win32'",
    "pyfuse3>=3.4.2",
    "trio>=0.22.0",
    "httpx>=0.24.0",
    "databricks-sdk>=0.20.0",
]

[dependency-groups]
dev = [
    "pyfuse3-stubs",
    "pytest>=7.4.0",
    "pytest-trio>=0.8.0",  # Critical for async tests
    "pytest-mock>=3.11.0", # For mocking UCClient/Persistence
    "pytest-cov",
    "respx",
    "ruff>=0.1.0",         # Fast Linter (Optional)
    "mypy>=1.5.0",         # Type Checker (Optional)
]

[project.urls]
"Homepage" = "https://github.com/zeehio/fuse4dbricks"

[project.scripts]
fuse4dbricks = "fuse4dbricks.main:cli_entry_point"

[tool.hatch.build.targets.wheel]
packages = ["fuse4dbricks"]

[tool.pytest.ini_options]
addopts = "--cov=fuse4dbricks --cov-report=html --cov-report=term-missing"

[[tool.mypy.overrides]]
module = "fuse4dbricks.*"
check_untyped_defs = true
